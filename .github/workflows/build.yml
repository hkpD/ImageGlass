# This workflow builds and patches ImageGlass by checking out the ORIGINAL d2phap/ImageGlass repository.
name: Build Patched ImageGlass (from Original Repo)

on:
  workflow_dispatch: # Allows you to run this manually with a button click.

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: THE CRITICAL FIX. Ignore the fork and get the code from the original source.
      - name: Checkout 'prod' branch from d2phap/ImageGlass
        uses: actions/checkout@v4
        with:
          repository: d2phap/ImageGlass  # <--- This is the most important line.
          ref: prod                     # <--- Get the 'prod' branch.
          submodules: recursive

      # Step 2: Verify that the file now exists before we do anything else.
      - name: Verify project file exists
        shell: pwsh
        run: |
          $cmdPath = "source/ImageGlass.Cmd/ImageGlass.Cmd.csproj"
          Write-Host "Checking for file at: $cmdPath"
          if (Test-Path $cmdPath) {
            Write-Host "SUCCESS: The project file was found."
          } else {
            Write-Host "FATAL ERROR: The project file was NOT found even after checking out the original repo." -ForegroundColor Red
            exit 1
          }

      # Step 3: Apply the patch to unlock Pro features.
      - name: Patch ProGate to enable all features
        shell: pwsh
        run: |
          $filePath = "source/Components/ImageGlass.UI/Settings/SettingPage.cs"
          if (Test-Path $filePath) {
            $originalText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs)'
            $replacementText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs) { return; } public void Dummy_ProGate'
            (Get-Content $filePath -Raw) -replace [System.Text.RegularExpressions.Regex]::Escape($originalText), $replacementText | Set-Content $filePath
            Write-Host "Successfully patched ProGate method in $filePath"
          } else {
            Write-Host "Patch file not found at $filePath. This is expected if the file moved." -ForegroundColor Yellow
          }

      # Step 4: Set up the correct build tool (MSBuild from Visual Studio).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Step 5: Build the main application and the command-line helper.
      - name: Build and Publish Main App (ImageGlass.Lib)
        run: >
          msbuild source/ImageGlass.Lib/ImageGlass.Lib.csproj 
          -restore -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishTrimmed=false -p:PublishDir="${{ github.workspace }}\publish"
      - name: Build and Publish Command-Line App (ImageGlass.Cmd)
        run: >
          msbuild source/ImageGlass.Cmd/ImageGlass.Cmd.csproj 
          -restore -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:PublishTrimmed=false -p:PublishDir="${{ github.workspace }}\publish"

      # Step 6: Upload the final artifact.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-Patched-PROD-Build-Final
          path: ./publish
