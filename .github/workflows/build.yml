name: Build Patched ImageGlass (PROD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the official 'prod' branch directly.
      - name: Checkout 'prod' branch from d2phap/ImageGlass
        uses: actions/checkout@v4
        with:
          repository: d2phap/ImageGlass
          ref: prod
          submodules: recursive

      # Step 2: Dynamically find and patch ProGate.
      - name: Auto-Locate and Patch ProGate
        shell: pwsh
        run: |
          Write-Host "Scanning repository for ProGate method..."
          $originalText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs)'
          $replacementText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs) { return; } public void Dummy_ProGate'
          
          # Find all .cs files in the source directory
          $allCsFiles = Get-ChildItem -Path source -Recurse -Filter *.cs
          $patched = $false
          
          foreach ($file in $allCsFiles) {
              $content = Get-Content $file.FullName -Raw
              
              # If we find the exact ProGate code in this file...
              if ($content.Contains($originalText)) {
                  Write-Host "TARGET ACQUIRED: $($file.FullName)"
                  
                  # Replace it and save
                  $newContent = $content.Replace($originalText, $replacementText)
                  Set-Content -Path $file.FullName -Value $newContent
                  
                  Write-Host "Successfully neutralized ProGate."
                  $patched = $true
                  break
              }
          }
          
          if (-not $patched) {
              Write-Host "FATAL ERROR: Could not find the ProGate code in any file. The author may have changed the method signature." -ForegroundColor Red
              exit 1
          }

      # Step 3: Set up MSBuild.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Step 4: Build the ACTUAL executable project. 
      - name: Build and Publish ImageGlass App
        run: >
          msbuild source/ImageGlass/ImageGlass.csproj 
          -restore 
          -t:Publish 
          -p:Configuration=Release 
          -p:Platform=x64 
          -p:RuntimeIdentifier=win-x64 
          -p:PublishTrimmed=false 
          -p:PublishDir="${{ github.workspace }}\publish"

      # Step 5: Upload the result.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-Patched-App
          path: ./publish
