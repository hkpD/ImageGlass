name: Build Patched ImageGlass (PROD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the official 'prod' branch directly.
      - name: Checkout 'prod' branch from d2phap/ImageGlass
        uses: actions/checkout@v4
        with:
          repository: d2phap/ImageGlass
          ref: prod
          submodules: recursive

      # Step 2: Apply your patch to the SettingPage.cs file to unlock Pro features.
      - name: Patch ProGate to enable all features
        shell: pwsh
        run: |
          $filePath = "source/Components/ImageGlass.UI/Settings/SettingPage.cs"
          if (Test-Path $filePath) {
            $originalText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs)'
            $replacementText = 'protected void ProGate(ConfigId id, Control? badge, params Control?[] inputs) { return; } public void Dummy_ProGate'
            (Get-Content $filePath -Raw) -replace [System.Text.RegularExpressions.Regex]::Escape($originalText), $replacementText | Set-Content $filePath
            Write-Host "Successfully patched ProGate method in $filePath"
          } else {
            Write-Host "FATAL ERROR: Patch file not found!" -ForegroundColor Red
            exit 1
          }

      # Step 3: Set up MSBuild.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Step 4: Build the ACTUAL executable project. 
      # (This automatically compiles ImageGlass.Lib and bundles everything together).
      - name: Build and Publish ImageGlass App
        run: >
          msbuild source/ImageGlass/ImageGlass.csproj 
          -restore 
          -t:Publish 
          -p:Configuration=Release 
          -p:Platform=x64 
          -p:RuntimeIdentifier=win-x64 
          -p:PublishTrimmed=false 
          -p:PublishDir="${{ github.workspace }}\publish"

      # Step 5: Upload the result.
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-Patched-App
          path: ./publish
