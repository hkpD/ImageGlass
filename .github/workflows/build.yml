name: Build ImageGlass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild v9/ImageGlass/ImageGlass.csproj -t:Restore -p:Configuration=Release -p:RuntimeIdentifier=win-x64

      - name: Publish
        run: >
          msbuild v9/ImageGlass/ImageGlass.csproj
          -t:Publish
          -p:Configuration=Release
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:PublishDir=${{ github.workspace }}\publish\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-win-x64
          path: ./publish
