name: Build ImageGlass (Full Version)

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # CRITICAL: Pulls in all external dependencies

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        # Restores all NuGet packages for the entire solution
        run: |
          dotnet restore v9/ImageGlass.sln

      - name: Build & Publish ImageGlass
        # Build the SOLUTION, not just the project
        run: |
          dotnet publish v9/ImageGlass.sln -c Release -r win-x64 --self-contained true -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageGlass-Pro-Build-x64
          path: ./publish
